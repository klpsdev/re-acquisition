# Render Blueprint: New → Blueprint → point at this repo. Creates the API, the web app and a Postgres DB.
# Add secrets (RENTCAST_API_KEY, ANTHROPIC_API_KEY, ...) in the API service's Environment tab.
services:
  - type: web
    name: sprev-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: DATA_MODE
        value: sample
      - key: DATABASE_URL
        fromDatabase: { name: sprev-db, property: connectionString }
      - key: CORS_ORIGINS
        value: https://sprev-web.onrender.com
      - key: RENTCAST_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
  - type: web
    name: sprev-web
    runtime: docker
    rootDir: frontend
    envVars:
      - key: BACKEND_URL
        value: https://sprev-api.onrender.com
databases:
  - name: sprev-db
    plan: free
