# Render Blueprint: New → Blueprint → select this repo.
# Creates the API, the web app and a Postgres database on free plans.
# You'll be asked for SITE_USERNAME and SITE_PASSWORD (the login for the web app).
# API keys (RENTCAST_API_KEY, ANTHROPIC_API_KEY, ...) are optional; add them later
# in the sprev-api service's Environment tab.
services:
  - type: web
    name: sprev-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATA_MODE
        value: sample
      - key: DATABASE_URL
        fromDatabase: { name: sprev-db, property: connectionString }
      - key: API_TOKEN
        generateValue: true
      - key: CENSUS_API_KEY
        sync: false
      - key: RENTCAST_API_KEY
        sync: false
      - key: RESO_BASE_URL
        value: https://bright-reso.tst.brightmls.com/RESO/OData/bright
      - key: RESO_TOKEN_URL
        sync: false
      - key: RESO_CLIENT_ID
        sync: false
      - key: RESO_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_SENDER
        sync: false

  - type: web
    name: sprev-web
    runtime: docker
    rootDir: frontend
    plan: free
    envVars:
      # Public URL of the API service. If Render gives sprev-api a different URL,
      # change this and redeploy (it's read at build time).
      - key: BACKEND_URL
        value: https://sprev-api.onrender.com
      - key: API_TOKEN
        fromService: { type: web, name: sprev-api, envVarKey: API_TOKEN }
      - key: SITE_USERNAME
        sync: false
      - key: SITE_PASSWORD
        sync: false

databases:
  - name: sprev-db
    plan: free
